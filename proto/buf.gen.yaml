# Generates three things from one contract:
#   - Go server stubs and the grpc-gateway mux for the backend
#   - An OpenAPI v2 document, so the HTTP projection is browsable
#   - TypeScript types for the VS Code extension, which speaks JSON to the
#     gateway rather than gRPC, but still wants the wire shapes checked
version: v2
managed:
  enabled: true
plugins:
  - remote: buf.build/protocolbuffers/go
    out: ../gen/go
    opt: paths=source_relative
  - remote: buf.build/grpc/go
    out: ../gen/go
    opt: paths=source_relative
  - remote: buf.build/grpc-ecosystem/gateway
    out: ../gen/go
    opt: paths=source_relative
  - remote: buf.build/grpc-ecosystem/openapiv2
    out: ../gen/openapi
  - remote: buf.build/bufbuild/es
    out: ../src/gen
    opt: target=ts
